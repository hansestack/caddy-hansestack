services:
  # Caddy, pre-built with the Hansestack leak-check plugin baked in.
  # Pulls the official image from GHCR — no local Go/xcaddy toolchain or
  # repo clone required to run this stack. Pin a specific version
  # (e.g. ghcr.io/hansestack/caddy-hansestack:1.0.0) for production instead
  # of floating on :latest.
  caddy:
    image: ghcr.io/hansestack/caddy-hansestack:latest
    # pull_policy: always
    # For local plugin development instead, comment out "image" and
    # "pull_policy" above and uncomment the line below to build from the
    # working tree:
    # build: .
    container_name: hansestack-caddy
    restart: always
    ports:
      - "8080:80"
      # Admin API / Prometheus metrics endpoint (see Caddyfile's "metrics"
      # global option). Bound to localhost only inside the container; only
      # exposed here for local scraping/debugging convenience.
      - "127.0.0.1:2019:2019"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Secret injection: the API key never lives in the Caddyfile itself,
      # only the {$HANSESTACK_API_KEY} placeholder does. Caddy resolves it
      # from this environment variable at config-load time.
      HANSESTACK_API_KEY: ${HANSESTACK_API_KEY:?HANSESTACK_API_KEY must be set}
      # Optional tuning knobs for the Leak-Check API client, resolved by the
      # Caddyfile's {$VAR:default} placeholders below. Leave unset in .env to
      # keep hansestack-go's own defaults (500ms timeout, circuit breaker
      # disabled).
      HANSESTACK_TIMEOUT: ${HANSESTACK_TIMEOUT:-500ms}
      HANSESTACK_CIRCUIT_BREAKER_THRESHOLD: ${HANSESTACK_CIRCUIT_BREAKER_THRESHOLD:-0}
      HANSESTACK_CIRCUIT_BREAKER_COOLDOWN: ${HANSESTACK_CIRCUIT_BREAKER_COOLDOWN:-30s}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - dummy-backend
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 5

  # The protected target (simulating a customer's backend). Zero-code
  # integration: this container has no idea Hansestack exists.
  dummy-backend:
    image: traefik/whoami
    container_name: hansestack-dummy-backend
    expose:
      - "80"

volumes:
  caddy_data:
  caddy_config:
