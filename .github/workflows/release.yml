name: Release

# Triggered exclusively by pushing a SemVer tag (e.g. v1.0.0). This is the
# single quality gate before an enterprise customer's infrastructure can
# pull ghcr.io/hansestack/caddy-hansestack:<tag> or pin
# xcaddy build --with github.com/hansestack/caddy-hansestack@<tag>.
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # hansestack/caddy-hansestack

permissions:
  contents: read
  packages: read

jobs:
  # Re-run the full quality gate on the tagged commit itself, independent of
  # whatever CI result the commit had on its way to main. A release must
  # never ship on trust alone.
  verify:
    name: Verify (Build, Test, gofmt, mod tidy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$diff"
            exit 1
          fi

      - name: go mod tidy (no drift)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test (race + coverage)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

  # Build the custom Caddy+plugin image from the existing Dockerfile and
  # push it to GHCR, tagged both with the exact release version and "latest".
  publish-image:
    name: Build & Push GHCR Image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=semver against the pushed tag (e.g. refs/tags/v1.2.3) yields
          # both "1.2.3" and "1.2" tags; "latest" is added explicitly so a
          # release always moves the floating tag forward, never a branch push.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish the GitHub Release entry itself, once the image is safely in GHCR.
  publish-release:
    name: Create GitHub Release
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can be generated

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

      - name: Warm Go module proxy
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Priming proxy.golang.org makes the tagged version installable via
          # xcaddy and visible on pkg.go.dev immediately, instead of on the
          # first external request.
          GOPROXY=proxy.golang.org go list -m \
            "github.com/hansestack/caddy-hansestack@${TAG}"
